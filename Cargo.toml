[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/anki-connect-client", "crates/ankic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/unnikrishnan-ag/ankic"

[workspace.dependencies]
anki-connect-client = { path = "crates/anki-connect-client", version = "0.1.0", default-features = false }
assert_cmd = "2"
clap = { version = "4", features = ["derive", "env"] }
jsonschema = { version = "0.29", default-features = false }
mockito = "1"
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
