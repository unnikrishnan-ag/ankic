[package]
name = "ankic"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/unnikrishnan-ag/ankic"
description = "Rust CLI for Anki-Connect API v1, designed for complete API coverage and LLM agent skill usage"

[[bin]]
name = "ankic"
path = "src/main.rs"

[lib]
name = "ankic"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
jsonschema = { version = "0.29", default-features = false }
mockito = "1"
predicates = "3"
